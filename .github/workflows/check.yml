name: Linux release gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packaged binaries
        type: string
        default: dev

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make installer-test
      - run: make check
      - run: make fuzz
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-regressions-${{ github.run_attempt }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: warn
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated smoke dependencies
        run: |
          python -m venv "$RUNNER_TEMP/lazyrun-smoke"
          "$RUNNER_TEMP/lazyrun-smoke/bin/python" -m pip install -r examples/smoke/requirements.txt
      - name: Real Flask / Celery lifecycle gates
        run: LAZYRUN_SMOKE_PYTHON="$RUNNER_TEMP/lazyrun-smoke/bin/python" make smoke

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make audit

  package:
    needs: [check, smoke, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build and verify release packages
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          make release VERSION="$VERSION"
          bash scripts/check-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazyrun-linux
          path: dist/*
          if-no-files-found: error
          overwrite: true
