name: Linux release gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run full fuzzing and build release packages
        type: boolean
        default: true
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packaged binaries
        type: string
        default: dev
      full:
        description: Run full fuzzing and build release packages
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Superseded branch/PR checks should not consume runners. Release callers use
# tag refs and must finish their gates and artifact upload without cancellation.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Offline installer tests
        run: make installer-test
      - name: Formatting, vet, and race tests
        run: make check 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Fuzz tests
        id: fuzz
        env:
          FUZZ_TIME: ${{ (inputs.full || github.event_name == 'schedule') && '30s' || '5s' }}
          FUZZ_PARALLEL: ${{ (inputs.full || github.event_name == 'schedule') && '4' || '2' }}
        run: make fuzz 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/check.log
            ${{ runner.temp }}/fuzz.log
            internal/**/testdata/fuzz/**
          if-no-files-found: warn
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/smoke/requirements.txt
      - name: Install isolated smoke dependencies
        run: |
          python -m venv "$RUNNER_TEMP/lazyrun-smoke"
          "$RUNNER_TEMP/lazyrun-smoke/bin/python" -m pip install -r examples/smoke/requirements.txt
      - name: Real Flask / Celery lifecycle gates
        run: |
          LAZYRUN_SMOKE_PYTHON="$RUNNER_TEMP/lazyrun-smoke/bin/python" make smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Preserve smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: warn
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make audit

  package:
    if: inputs.full || github.event_name == 'schedule'
    needs: [check, smoke, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Build and verify release packages
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          make release VERSION="$VERSION"
          bash scripts/check-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazyrun-linux
          path: dist/*
          if-no-files-found: error
          overwrite: true
